# Property Management System Configuration

[database]
path = data/property_manage.db

[ui]
page_size = 10
color_enabled = true

[limits]
max_properties = 10000
max_users = 1000
max_string_len = 500
max_field_len = 50

[paths]
data_dir = data/
users_file = data/users.dat
salts_file = data/salts.dat
codes_file = data/codes.dat
logged_in_file = data/logged_in.dat
properties_file = data/properties.dat